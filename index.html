    <!-- Google Analytics + exclusão dos acessos da proprietária -->
    <script>
      (function () {
        const OWNER_KEY = "portfolio_owner_device";
        const params = new URLSearchParams(window.location.search);
        const ownerParam = params.get("owner");

        if (ownerParam === "1") {
          localStorage.setItem(OWNER_KEY, "1");
        } else if (ownerParam === "0") {
          localStorage.removeItem(OWNER_KEY);
        }

        if (ownerParam === "1" || ownerParam === "0") {
          params.delete("owner");
          const cleanQuery = params.toString();
          const cleanUrl =
            window.location.pathname +
            (cleanQuery ? "?" + cleanQuery : "") +
            window.location.hash;
          window.history.replaceState({}, document.title, cleanUrl);
        }

        const isOwner = localStorage.getItem(OWNER_KEY) === "1";

        if (!isOwner) {
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () {
            window.dataLayer.push(arguments);
          };

          window.gtag("js", new Date());
          window.gtag("config", "G-34H6B88D02");

          const analyticsScript = document.createElement("script");
          analyticsScript.async = true;
          analyticsScript.src =
            "https://www.googletagmanager.com/gtag/js?id=G-34H6B88D02";
          document.head.appendChild(analyticsScript);
        }
      })();
    </script>
