    <!-- Identifica os navegadores da proprietária e desativa o Analytics neles -->
    <script>
      (function () {
        const measurementId = "G-34H6B88D02";
        const ownerKey = "portfolio_owner_device";

        const params = new URLSearchParams(window.location.search);
        const ownerParam = params.get("owner");

        if (ownerParam === "1") {
          localStorage.setItem(ownerKey, "1");
        }

        if (ownerParam === "0") {
          localStorage.removeItem(ownerKey);
        }

        if (localStorage.getItem(ownerKey) === "1") {
          window["ga-disable-" + measurementId] = true;
        }

        if (ownerParam === "1" || ownerParam === "0") {
          params.delete("owner");

          const query = params.toString();
          const cleanUrl =
            window.location.pathname +
            (query ? "?" + query : "") +
            window.location.hash;

          window.history.replaceState({}, document.title, cleanUrl);
        }
      })();
    </script>
