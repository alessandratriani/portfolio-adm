<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Analytics 4 + exclusão dos acessos da proprietária
         1) Troque G-COLE_SEU_ID_AQUI pelo ID do seu fluxo do GA4.
         2) No notebook e no celular, abra uma vez: ?owner=1
            Ex.: https://alessandratriani.github.io/portfolio-adm/?owner=1
         3) Para voltar a contabilizar um navegador, abra: ?owner=0
    -->
    <script>
      (() => {
        const GA_MEASUREMENT_ID = 'G-COLE_SEU_ID_AQUI';
        const OWNER_KEY = 'portfolio_adm_owner_no_analytics';
        const params = new URLSearchParams(window.location.search);
        const ownerMode = params.get('owner');

        try {
          if (ownerMode === '1') {
            localStorage.setItem(OWNER_KEY, '1');
          } else if (ownerMode === '0') {
            localStorage.removeItem(OWNER_KEY);
          }
        } catch (error) {
          // Se o navegador bloquear armazenamento local, o site continua funcionando.
        }

        if (params.has('owner')) {
          params.delete('owner');
          const query = params.toString();
          const cleanUrl =
            window.location.pathname +
            (query ? `?${query}` : '') +
            window.location.hash;
          window.history.replaceState({}, document.title, cleanUrl);
        }

        let isOwner = false;
        try {
          isOwner = localStorage.getItem(OWNER_KEY) === '1';
        } catch (error) {
          isOwner = false;
        }

        const validMeasurementId =
          /^G-[A-Z0-9]+$/i.test(GA_MEASUREMENT_ID) &&
          !GA_MEASUREMENT_ID.includes('COLE_SEU_ID_AQUI');

        // Não carrega o Analytics para a proprietária nem antes do ID real ser configurado.
        if (isOwner || !validMeasurementId) return;

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag('js', new Date());
        window.gtag('config', GA_MEASUREMENT_ID);

        const analyticsScript = document.createElement('script');
        analyticsScript.async = true;
        analyticsScript.src =
          'https://www.googletagmanager.com/gtag/js?id=' +
          encodeURIComponent(GA_MEASUREMENT_ID);
        document.head.appendChild(analyticsScript);
      })();
    </script>
